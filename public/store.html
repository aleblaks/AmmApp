<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scarica l'app</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #0a0a14;
      color: #e8e9f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px;
      text-align: center;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 2.5px solid #25275a;
      border-top-color: #818cf8;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #9a9cc4; font-size: 1rem; }
    .links { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    a {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      border: 1px solid #25275a;
      color: #e8e9f5;
      background: #161636;
    }
    a:hover { border-color: #6366f1; }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <p id="msg">Apertura in corso…</p>
  <div class="links" id="links" style="display:none"></div>
  <script>
    const IOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const ANDROID = /android/i.test(navigator.userAgent);
    const IOS_URL = 'https://apps.apple.com/it/app/fantastical-calendar-tasks/id975937182?mt=12';
    const ANDROID_URL = 'https://play.google.com/store/apps/details?id=com.aleblaks.TurniAeroporto';

    if (IOS) {
      window.location.replace(IOS_URL);
    } else if (ANDROID) {
      window.location.replace(ANDROID_URL);
    } else {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('msg').textContent = 'Scegli la tua piattaforma:';
      const links = document.getElementById('links');
      links.style.display = 'flex';
      links.innerHTML = `
        <a href="${IOS_URL}">App Store · iPhone</a>
        <a href="${ANDROID_URL}">Google Play · Android</a>
      `;
    }
  </script>
</body>
</html>
